plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'java'
}

group = 'com.ejemplo.inventario'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = "21"
    modules = [ 'javafx.controls' ]
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
}

application {
    mainClass = 'ui.app.MainApp'
}

// Temporal: para probar el servicio, podemos crear una tarea que ejecute el main de ProductoService
// Pero por ahora, el usuario puede ejecutar: ./gradlew run --args="service" o algo similar?
// En lugar de complicar, dejaremos que el usuario ejecute el main directamente desde su IDE o con:
// java -cp build/classes/java/main:build/libs/* service.ProductoService
// Pero para simplificar, añadimos una tarea de ejecución para la clase de servicio de prueba.
task runServiceTest(type: JavaExec) {
    group = 'verification'
    description = 'Ejecuta la prueba temporal de ProductoService'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'service.ProductoService'
}

// También podemos hacer que 'run' ejecute la prueba si no hay UI aún, pero mejor mantener la aplicación principal.
// Como aún no tenemos MainApp, podemos cambiar temporalmente la mainClass para probar.
// Pero el usuario puede ejecutar: ./gradlew runServiceTest